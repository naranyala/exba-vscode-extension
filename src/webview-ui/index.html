<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <title>WASM Custom Element Dashboard</title>
</head>
<body>
    <div id="app-root"></div>
    
    <script type="module">
        import { WasmComponent } from './bundle.js';
        
        (async () => {
            try {
                const wasmUri = document.body.dataset.wasmUri;
                await WasmComponent.initWasm(wasmUri);
                
                const app = document.createElement('dashboard-app');
                document.getElementById('app-root').appendChild(app);
            } catch (err) {
                console.error("Failed to initialize WASM Web Component:", err);
                document.getElementById('app-root').innerHTML = `
                    <div style="padding: 3rem; text-align: center; color: #f87171;">
                        <h3>Failed to load calculation engine</h3>
                        <p>${err.message}</p>
                    </div>
                `;
            }
        })();
    </script>
</body>
</html>
